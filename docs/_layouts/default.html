<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/basic.css' | relative_url }}">
</head>
<body>

  <header>
    <h1>{{ site.title }}</h1>

    {{ content }}

    <p>© {{ site.time | date: "%Y" }} {{ site.title }}</p>
  </footer>

</body>
</html>
